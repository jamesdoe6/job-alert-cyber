name: Veille Emploi Cyber

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer les dépendances
        run: npm install

      - name: Écrire la clé de compte de service Google
        run: |
          mkdir -p secrets
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > secrets/service-account.json

      - name: Lancer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          SMTP_HOST:      smtp.gmail.com
          SMTP_PORT:      "465"
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ./secrets/service-account.json
          TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID }}
          SUGGESTIONS_SHEET_TAB: ${{ secrets.SUGGESTIONS_SHEET_TAB }}
        run: node veille-emploi-gemini.js

      - name: Sauvegarder les offres vues
        run: |
          git config user.name "Veille Bot"
          git config user.email "bot@veille.local"
          git add veille-seen-ids.json
          git diff --cached --quiet || git commit -m "seen: $(date +%Y-%m-%d)"
          git push